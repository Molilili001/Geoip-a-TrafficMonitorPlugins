name: CI - Build GeoIP

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release
        shell: cmd
        run: msbuild .\src\GeoIP\GeoIP.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=.\bin\x64\Release\ /m

      - name: Upload artifact (GeoIP.dll x64 Release)
        uses: actions/upload-artifact@v4
        with:
          name: GeoIP-dll-x64-Release
          path: bin/x64/Release/GeoIP.dll